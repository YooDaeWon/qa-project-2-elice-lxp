[pytest]
pythonpath = .
testpaths = tests/e2euiux tests/api tests/api_security

markers =

    # E2E/UI/UX 마커
    exam_flow: ID 1부터 15까지 연속 E2E 시험 흐름
    exam_retake_flow: ID 24부터 26까지 연속 E2E 시험 재응시 흐름
    board_flow: ID 16부터 20까지 연속 E2E 게시판 흐름
    schedule_flow: ID 21부터 23까지 연속 E2E 수업 일정 흐름
    schedule_management_flow: ID 27부터 35까지 연속 E2E 수업 일정 관리 흐름
    exam_status_flow: ID 36부터 40까지 연속 E2E 시험 응시 현황 흐름
    exam_multi: ID 41 다중 탭 시험 흐름
    exam_reload_save: ID 42 새로고침 후 답안 저장 흐름
    exam_timeout: ID 48 제한 시간 종료 검증
    board_offline: ID 43부터 44까지 네트워크 중단 게시물 저장 검증
    board_duplicate: ID 45 게시물 중복 요청 검증
    board_title_limit: ID 46 게시물 제목 글자 수 제한 검증
    exam_offline: ID 47 네트워크 중단 시험 문제 불러오기 검증
    invalid_url: ID 49 존재하지 않는 URL 접근 검증
    responsive_layout: ID 50부터 53까지 반응형 메뉴 검증
    mocking500: ID 54 클래스 조회 API 500 Mock 검증
    login_flow: ID 55부터 60까지 로그인 예외 흐름

    # LOAD 마커
    load_login: ID 1 로그인 부하
    load_token: ID 2 토큰 연동 과목 조회 부하
    load_transaction: ID 3부터 7까지 연쇄 트랜잭션 부하
    load_profile: ID 8부터 11까지 부하 프로필
    load_safety: ID 12부터 15까지 안전성 통제 검증


    # SECURITY 마커
    sec_auth_login: 보안 - 인증·로그인/인증강도
    slow: 실행이 느린 테스트 (반복 요청 등)
    sec_token_session: 보안 - 토큰·세션
    sec_bola: 보안 - 객체권한 BOLA
    sec_privilege: 보안 - 권한상승
    sec_msa: 보안 - MSA/아키텍처
    sec_business: 보안 - 비즈니스로직
    sec_injection: 보안 - 인젝션(웹 취약점)
    sec_info_disclosure: 보안 - 정보노출(웹 취약점)
    sec_browser: 보안 - 브라우저 렌더링 검증 필요(Playwright)
    
    # API 마커
    api: API 테스트
    classroom: 클래스룸 API 테스트
    course: 과목 API 테스트
    schedule: 수업 일정 API 테스트
    board: 게시판 API 테스트
    positive: 정상 동작 검증
    negative: 오류 및 차단 동작 검증
    destructive: 데이터 변경 또는 삭제 테스트
